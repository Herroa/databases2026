version: '3.9'

services:
  pg-master:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./pgdata/master:/var/lib/postgresql/data
      - ./master:/docker/master
      - ./backups:/backups
    entrypoint: ["/docker/master/entrypoint_master.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  pg-replica:
    image: postgres:16
    depends_on:
      pg-master:
        condition: service_healthy
    ports:
      - "5434:5432"
    volumes:
      - ./pgdata/replica:/var/lib/postgresql/data
      - ./replica:/docker/replica
    entrypoint: ["/docker/replica/entrypoint_replica.sh"]

  pg-backup:
    image: postgres:16
    depends_on:
      pg-master:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./backups:/backups
      - ./backup:/docker/backup
    entrypoint: ["/docker/backup/backup.sh"]
