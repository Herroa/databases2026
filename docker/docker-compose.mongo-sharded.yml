version: "3.9"

services:
  configsvr:
    image: mongo:7
    container_name: configsvr
    command: mongod --configsvr --replSet configRepl --port 27019 --bind_ip_all
    ports:
      - "27019:27019"
    volumes:
      - config_data:/data/db

  shard1:
    image: mongo:7
    container_name: shard1
    command: mongod --shardsvr --replSet shardRepl1 --port 27018 --bind_ip_all
    ports:
      - "27018:27018"
    volumes:
      - shard1_data:/data/db

  shard2:
    image: mongo:7
    container_name: shard2
    command: mongod --shardsvr --replSet shardRepl2 --port 27020 --bind_ip_all
    ports:
      - "27020:27020"
    volumes:
      - shard2_data:/data/db

  mongos:
    image: mongo:7
    container_name: mongos
    depends_on:
      - configsvr
      - shard1
      - shard2
    command: mongos --configdb configRepl/configsvr:27019 --bind_ip_all
    ports:
      - "27017:27017"

volumes:
  config_data:
  shard1_data:
  shard2_data: